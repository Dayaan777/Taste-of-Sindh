<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Taste of Sindh</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:420px;
            background:#fff;
            border:1px solid #ddd;
            border-radius:12px;
            padding:30px;
        }

        .logo{
            display:block;
            width:80px;
            margin:0 auto 10px;
        }

        h1{
            text-align:center;
            color:#000;
            font-size:22px;
            margin-bottom:5px;
        }

        .subtitle{
            text-align:center;
            color:#666;
            font-size:13px;
            margin-bottom:20px;
        }

        .tabs{
            display:flex;
            margin-bottom:20px;
            border:1px solid #ddd;
            border-radius:8px;
            overflow:hidden;
        }

        .tab{
            flex:1;
            text-align:center;
            padding:10px;
            text-decoration:none;
            font-size:14px;
        }

        .active{
            background:#000;
            color:#fff;
        }

        .inactive{
            background:#fff;
            color:#000;
        }

        h2{
            font-size:16px;
            margin-bottom:15px;
            color:#000;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:12px;
            border:1px solid #ddd;
            border-radius:6px;
            font-size:14px;
        }

        button{
            width:100%;
            padding:12px;
            background:#000;
            color:#fff;
            border:none;
            border-radius:6px;
            font-size:15px;
            cursor:pointer;
        }

        button:hover{
            background:#222;
        }

        .demo{
            margin-top:20px;
            padding:15px;
            border:1px solid #ddd;
            border-radius:10px;
            text-align:center;
            background:#fafafa;
        }

        .demo h3{
            font-size:14px;
            margin-bottom:10px;
        }

        .demo a{
            display:block;
            margin-top:8px;
            padding:10px;
            text-decoration:none;
            background:#000;
            color:#fff;
            border-radius:6px;
            font-size:13px;
        }

        .demo a:hover{
            background:#222;
        }

    </style>
</head>

<body>

<div class="container">

    <img src="images/logo.png" class="logo">

    <h1>Taste of Sindh</h1>
    <p class="subtitle">Create Admin Account</p>

    <div class="tabs">
        <a href="auth.html" class="tab inactive">Login</a>
        <a href="signup.html" class="tab active">Sign Up</a>
    </div>

    <h2>Create New Account</h2>

    <input type="text" placeholder="Full Name">
    <input type="text" placeholder="Username">
    <input type="email" placeholder="Email Address">
    <input type="text" placeholder="Phone Number">
    <input type="password" placeholder="Create Password">
    <input type="password" placeholder="Confirm Password">

    <button>Sign Up</button>

    <div class="demo">

        <h3>Quick Access</h3>

        <a href="index.html">Home</a>
        <a href="admin/dashboard.html">Admin Dashboard</a>

    </div>

</div>

</body>
</html>
