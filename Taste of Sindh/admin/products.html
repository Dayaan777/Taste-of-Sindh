<!DOCTYPE html>
<html>
<head>
    <title>Products - Admin Panel</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        /* SIDEBAR */
        .sidebar{
            width:250px;
            height:100vh;
            position:fixed;
            left:0;
            top:0;
            background:#000;
            color:#fff;
            padding:25px 20px;
        }

        .logo{
            text-align:center;
            margin-bottom:35px;
        }

        .logo img{
            width:80px;
            height:40px;
            margin-bottom:10px;
        }

        .logo h2{
            font-size:14px;
            letter-spacing:2px;
            margin-top:10px;
        }

        .menu a{
            display:block;
            color:#fff;
            text-decoration:none;
            padding:12px;
            margin-bottom:8px;
            border-radius:6px;
            font-size:14px;
        }

        .menu a:hover{
            background:#222;
        }

        .menu a.active{
            background:#fff;
            color:#000;
            font-weight:bold;
        }

        /* MAIN */
        .main{
            margin-left:250px;
            padding:25px;
        }

        /* TOPBAR */
        .topbar{
            background:#fff;
            border:1px solid #ddd;
            padding:18px;
            border-radius:12px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .topbar h1{
            font-size:18px;
        }

        .topbar a{
            text-decoration:none;
            background:#000;
            color:#fff;
            padding:10px 15px;
            border-radius:8px;
            font-size:13px;
        }

        .topbar a:hover{
            background:#222;
        }

        /* GRID */
        .grid{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:15px;
            margin-top:20px;
        }

        .product-card{
            background:#fff;
            border:1px solid #ddd;
            border-radius:12px;
            overflow:hidden;
            transition:0.2s;
        }

        .product-card:hover{
            transform:translateY(-4px);
        }

        .product-card img{
            width:100%;
            height:180px;
            object-fit:cover;
        }

        .content{
            padding:15px;
        }

        .content h3{
            font-size:15px;
            margin-bottom:5px;
        }

        .price{
            font-weight:bold;
            margin:8px 0;
        }

        .rating{
            font-size:13px;
            color:#666;
        }

        .discount{
            font-size:12px;
            color:#999;
        }

        .btns{
            margin-top:12px;
            display:flex;
            gap:8px;
        }

        .btns button{
            flex:1;
            padding:8px;
            border:none;
            cursor:pointer;
            border-radius:6px;
            font-size:12px;
        }

        .edit{
            background:#000;
            color:#fff;
        }

        .delete{
            background:#ddd;
            color:#000;
        }

        .edit:hover{
            background:#222;
        }

        .delete:hover{
            background:#ccc;
        }

    </style>
</head>
