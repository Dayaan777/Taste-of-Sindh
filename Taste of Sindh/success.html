<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Placed</title>

<style>
body{
    margin:0;
    font-family:'Poppins', Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#f5f5f5;
    padding:20px;
}

.box{
    text-align:center;
    background:#fff;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
    max-width:500px;
    width:100%;
}

.box h1{
    color:#28a745;
    margin-bottom:12px;
}

.box p{
    color:#555;
    line-height:1.6;
}

.success-buttons{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:25px;
}

.button{
    display:inline-block;
    padding:12px 22px;
    text-decoration:none;
    border-radius:25px;
    font-weight:600;
    transition:0.3s ease;
}

.primary-btn{
    background:#e21b70;
    color:#fff;
}

.primary-btn:hover{
    background:#c2185b;
}

.secondary-btn{
    background:#f0f0f0;
    color:#333;
}

.secondary-btn:hover{
    background:#e0e0e0;
}

@media(max-width:600px){
    .success-buttons{
        flex-direction:column;
    }

    .button{
        width:100%;
        text-align:center;
    }
}
</style>

</head>

<body>

<div class="box">
    <h1>🎉 Order Placed Successfully!</h1>
    <p>Your order has been received and is being processed.</p>

    <div class="success-buttons">
        <a href="index.html" class="button secondary-btn">Back to Home</a>
        <a href="track-order.html" class="button primary-btn">Track Your Order</a>
    </div>
</div>

</body>
</html>
